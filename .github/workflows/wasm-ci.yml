name: WebAssembly Engine Pipeline

on:
  schedule:
    # Wakes up at 34 minutes past 0 AM, 6 AM, 12 PM, and 6 PM UTC
    # (8:34 AM, 2:34 PM, 8:34 PM, and 2:34 AM Singapore Time)
    - cron: '34 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  wasm-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate AssemblyScript Spec
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Wasm assembly specs current. Skipping execution."
            exit 0
          fi

          mkdir -p assembly
          TARGET_FILE="assembly/index.ts"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "// Core WebAssembly AssemblyScript Definitions" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
          fi

          COMPONENTS=("MemoryBuffer" "NodeState" "MetricVector" "CacheEntry" "WasmContext")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "// Wasm memory node class payload $RANDOM" >> "$TARGET_FILE"
          echo "export class ${PICKED_COMP}_$RANDOM {" >> "$TARGET_FILE"
          echo "  id: u32 = $RANDOM;" >> "$TARGET_FILE"
          echo "  active: bool = true;" >> "$TARGET_FILE"
          echo "}" >> "$TARGET_FILE"

          git config --global user.name "RAYNELL763"
          git config --global user.email "raynell763@gmail.com"

          MESSAGES=(
            "feat: add AssemblyScript class representation for Wasm module"
            "refactor: optimize memory type allocations in index.ts"
            "fix: adjust primitive field bounds in Wasm schema"
            "chore: sync AssemblyScript compiler specifications"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add assembly/
          git commit -m "$MSG"
          git push
